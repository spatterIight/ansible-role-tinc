---
- name: Ensure Tinc package is installed
  ansible.builtin.package:
    name: tinc
    state: present
  notify: Restart Tinc
  tags: ansible-role-tinc

- name: Ensure Tinc base directory exists
  ansible.builtin.file:
    path: "{{ tinc_directory }}"
    state: directory
    mode: "0750"
    owner: "{{ tinc_user }}"
    group: "{{ tinc_group }}"
  notify: Restart Tinc
  tags: ansible-role-tinc

- name: Ensure Tinc network name directory exists
  no_log: "{{ tinc_no_log }}"
  ansible.builtin.file:
    path: "{{ tinc_directory }}/{{ item.network_name }}"
    state: directory
    mode: "0750"
    owner: "{{ tinc_user }}"
    group: "{{ tinc_group }}"
  notify: Restart Tinc
  loop: "{{ tinc_networks }}"
  tags: ansible-role-tinc

- name: Ensure Tinc hosts directory exists
  no_log: "{{ tinc_no_log }}"
  ansible.builtin.file:
    path: "{{ tinc_directory }}/{{ item.network_name }}/hosts"
    state: directory
    mode: "0750"
    owner: "{{ tinc_user }}"
    group: "{{ tinc_group }}"
  notify: Restart Tinc
  loop: "{{ tinc_networks }}"
  tags: ansible-role-tinc

- name: Ensure tinc.conf is present
  no_log: "{{ tinc_no_log }}"
  ansible.builtin.template:
    src: tinc.conf.j2
    dest: "{{ tinc_directory }}/{{ item.network_name }}/tinc.conf"
    owner: "{{ tinc_user }}"
    group: "{{ tinc_group }}"
    mode: "0644"
  notify: Restart Tinc
  loop: "{{ tinc_networks }}"
  tags: ansible-role-tinc

- name: Ensure tinc-up is present
  no_log: "{{ tinc_no_log }}"
  ansible.builtin.template:
    src: tinc-up.j2
    dest: "{{ tinc_directory }}/{{ item.network_name }}/tinc-up"
    owner: "{{ tinc_user }}"
    group: "{{ tinc_group }}"
    mode: "0755"
  notify: Restart Tinc
  loop: "{{ tinc_networks }}"
  tags: ansible-role-tinc

- name: Ensure tinc-down is present
  no_log: "{{ tinc_no_log }}"
  ansible.builtin.template:
    src: tinc-down.j2
    dest: "{{ tinc_directory }}/{{ item.network_name }}/tinc-down"
    owner: "{{ tinc_user }}"
    group: "{{ tinc_group }}"
    mode: "0755"
  notify: Restart Tinc
  loop: "{{ tinc_networks }}"
  tags: ansible-role-tinc

- name: Ensure Tinc RSA private key is present if defined
  no_log: "{{ tinc_no_log }}"
  ansible.builtin.template:
    src: rsa_key.priv.j2
    dest: "{{ tinc_directory }}/{{ item.network_name }}/rsa_key.priv"
    owner: "{{ tinc_user }}"
    group: "{{ tinc_group }}"
    mode: "0600"
  notify: Restart Tinc
  when: item.rsa_private_key is defined
  loop: "{{ tinc_networks }}"
  tags: ansible-role-tinc

- name: Generate Tinc RSA private key if missing
  no_log: "{{ tinc_no_log }}"
  community.crypto.openssl_privatekey:
    path: "{{ tinc_directory }}/{{ item.network_name }}/rsa_key.priv"
    size: 4096
    type: RSA
    mode: "0600"
  loop: "{{ tinc_networks }}"
  when: item.rsa_private_key is not defined
  notify: Restart Tinc
  tags: ansible-role-tinc

- name: Generate Tinc RSA public key if missing
  no_log: "{{ tinc_no_log }}"
  community.crypto.openssl_publickey:
    path: "{{ tinc_directory }}/{{ item.network_name }}/rsa_key.pub"
    privatekey_path: "{{ tinc_directory }}/{{ item.network_name }}/rsa_key.priv"
  loop: "{{ tinc_networks }}"
  when: item.rsa_public_key is not defined
  register: rsa_public_key
  tags: ansible-role-tinc

- name: Check Tinc RSA public key content for display
  no_log: "{{ tinc_no_log }}"
  ansible.builtin.slurp:
    src: "{{ tinc_directory }}/{{ item.item.network_name }}/rsa_key.pub"
  loop: "{{ rsa_public_key.results }}"
  when: item.changed # noqa: no-handler
  register: rsa_public_key_content
  tags: ansible-role-tinc

- name: Print Tinc RSA public key if newly generated
  no_log: "{{ tinc_no_log }}"
  ansible.builtin.debug:
    msg: "{{ item.content | b64decode }}"
  loop: "{{ rsa_public_key_content.results }}"
  when: item.content is defined
  tags: ansible-role-tinc

- name: Fail if Tinc RSA public key needs to be recorded
  ansible.builtin.fail:
    msg: "Please add the generated RSA public key, printed above, to your tinc_networks variables and re-run"
  when: rsa_public_key.results | selectattr('changed') | list | length > 0
  tags: ansible-role-tinc

- name: Ensure Tinc host file is present
  no_log: "{{ tinc_no_log }}"
  ansible.builtin.template:
    src: host.j2
    dest: "{{ tinc_directory }}/{{ item.network_name }}/hosts/{{ item.host_name }}"
    owner: "{{ tinc_user }}"
    group: "{{ tinc_group }}"
    mode: "0644"
  notify: Restart Tinc
  loop: "{{ tinc_networks }}"
  tags: ansible-role-tinc

- name: Ensure Tinc additional host files are present
  no_log: "{{ tinc_no_log }}"
  ansible.builtin.template:
    src: host.j2
    dest: "{{ tinc_directory }}/{{ item.0.network_name }}/hosts/{{ item.1.host_name }}"
    owner: "{{ tinc_user }}"
    group: "{{ tinc_group }}"
    mode: "0644"
  notify: Restart Tinc
  loop: "{{ tinc_networks | subelements('hosts') }}"
  tags: ansible-role-tinc
