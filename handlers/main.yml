---
- name: Restart Tinc
  no_log: "{{ tinc_no_log }}"
  ansible.builtin.service:
    name: "tinc@{{ item.network_name }}"
    enabled: yes
    state: restarted
  loop: "{{ tinc_networks }}"
  tags: ansible-role-tinc
